<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10251e">
  <meta name="description" content="骰盅對決：雙人三骰桌遊，不涉及金錢。">
  <title>骰盅對決</title>
  <link rel="stylesheet" href="./style.css?v=hk-6">
  <script type="module" src="./app.js?v=hk-6"></script>
</head>
<body>
<main class="game-shell">
  <header class="topbar">
    <h1>骰盅對決</h1>
    <button id="textBtn" class="text-button" type="button" aria-pressed="false">大字：關</button>
  </header>

  <section class="scoreboard" aria-label="玩家記分">
    <article class="player-card is-active" id="player1" aria-label="玩家 1">
      <span class="player-meta">玩家 1</span><strong class="score" id="score1">—</strong><span class="score-caption sr-only">本輪點數</span>
    </article>
    <article class="player-card" id="player2" aria-label="玩家 2">
      <span class="player-meta">玩家 2</span><strong class="score" id="score2">—</strong><span class="score-caption sr-only">本輪點數</span>
    </article>
  </section>

  <section class="turn-copy" aria-label="目前輪次及下一步">
    <h2 id="status" role="status" aria-live="polite">輪到玩家 1</h2>
    <p id="instruction">按住下方「搖骰」，再揭盅比點數</p>
  </section>

  <section class="stage-wrap" aria-label="骰盅遊戲區域">
    <div class="stage-frame">
      <div id="stage" class="stage" aria-label="三維骰盅舞台"></div>
      <span id="stageBadge" hidden>等待開局</span><p id="stageHint" hidden>三骰實時碰撞</p>
    </div>
  </section>

  <section class="play-panel" aria-label="遊戲操作">
    <section class="result-card" id="result" aria-live="polite" hidden></section>
    <p class="announcement sr-only" id="announcement" aria-live="polite" hidden></p>
    <div class="energy-track" id="energy" role="progressbar" aria-label="搖骰能量" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="energyFill"></div></div>
    <div class="controls">
      <button class="button button-primary" id="shakeBtn" type="button" aria-label="按住搖骰">按住搖骰</button>
      <button class="button button-primary" id="revealBtn" type="button" disabled hidden>揭盅</button>
      <p id="busyNotice" class="busy-notice" role="status" hidden>正在揭盅…</p>
      <button class="button button-primary next-button" id="nextBtn" type="button" hidden>交給玩家 2</button>
    </div>
  </section>

  <details class="settings" id="settingsPanel">
    <summary>設定與玩法</summary>
    <div class="settings-content">
      <div class="setting-grid">
        <button id="soundBtn" class="setting-button" type="button" aria-pressed="true">骰聲及報點：開</button>
        <button id="musicBtn" class="setting-button" type="button" aria-pressed="false">背景音樂：關</button>
        <button id="startBtn" class="setting-button" type="button">啟用手機體感</button>
        <button id="voiceBtn" class="setting-button" type="button">試聽廣東話報點</button>
      </div>
      <p id="sensorStatus" class="setting-note">亦可搖手機；首次操作會要求體感權限。</p>
      <p id="voiceStatus" class="setting-note">正在檢查廣東話語音…</p>
      <h3>玩法</h3>
      <p id="gameRules">兩人輪流搖三粒骰，總點數較大者勝，同分平局。</p>
      <p>搖好後按「揭盅」；體感已連接時，手機放平亦可自動揭盅。</p>
      <p id="footerRules" class="sr-only">三骰總點數較大者勝 · 同分平局 · 兩人輪流</p>
      <button class="setting-button reset-button" id="resetBtn" type="button">重新開始／分數清零</button>
      <p class="audio-credit">骰盅實錄：<a href="https://pixabay.com/sound-effects/dice-cup-60668/" target="_blank" rel="noopener">Breviceps / Pixabay</a> · <a href="https://pixabay.com/service/license-summary/" target="_blank" rel="noopener">內容授權</a>。背景音樂為原創合成短曲。</p>
      <p class="setting-note">輕鬆桌遊，不涉及賭博或金錢。</p>
    </div>
  </details>
  <footer class="game-footer"><p class="author-credit">作者：WONG WAI</p></footer>
</main>
</body>
</html>
