<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10251e">
  <meta name="description" content="骰盅對決：一場輕鬆的雙人三骰桌遊，不涉及賭博或金錢。">
  <title>骰盅對決</title>
  <link rel="stylesheet" href="./style.css?v=hk-3">
  <script type="module" src="./app.js?v=hk-3"></script>
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <div class="brand-lockup">
        <span class="brand-mark" aria-hidden="true"><span></span></span>
        <div>
          <p class="eyebrow">BIG DICE <span>·</span> WOOD CLACK <span>·</span> 粵語</p>
          <h1>骰盅對決</h1>
        </div>
      </div>
      <button class="icon-button sound-button" id="soundBtn" type="button" aria-label="聲音設定" title="聲音設定">
        <span class="sound-glyph" aria-hidden="true"><i></i><b></b></span>
      </button>
    </header>

    <section class="scoreboard" aria-label="玩家記分">
      <article class="player-card is-active" id="player1" aria-label="玩家 1">
        <div class="player-meta"><span class="player-dot" aria-hidden="true"></span><span>玩家 1</span></div>
        <strong class="score" id="score1" aria-label="玩家 1 得分">—</strong>
        <span class="score-caption">本輪點數</span>
      </article>
      <div class="versus" aria-hidden="true"><span>VS</span></div>
      <article class="player-card" id="player2" aria-label="玩家 2">
        <div class="player-meta"><span class="player-dot" aria-hidden="true"></span><span>玩家 2</span></div>
        <strong class="score" id="score2" aria-label="玩家 2 得分">—</strong>
        <span class="score-caption">本輪點數</span>
      </article>
    </section>

    <section class="stage-wrap" aria-label="骰盅遊戲區域">
      <div class="stage-frame">
        <div class="stage-grain" aria-hidden="true"></div>
        <div id="stage" class="stage" aria-label="三維骰盅舞台">
          <div class="stage-topline" aria-hidden="true"><span class="stage-rule"></span><span class="stage-ornament">✦</span><span class="stage-rule"></span></div>
        </div>
        <div class="stage-overlay stage-overlay-top">
          <span class="stage-badge" id="stageBadge"><span class="badge-dot" aria-hidden="true"></span>等待開局</span>
        </div>
        <p class="stage-hint" id="stageHint">大骰近景 · 三骰實時碰撞</p>
      </div>
      <div class="table-edge" aria-hidden="true"></div>
    </section>

    <section class="play-panel" aria-label="遊戲操作">
      <div class="turn-row">
        <div class="turn-copy">
          <p class="turn-status" id="status" role="status" aria-live="polite">輪到玩家 1</p>
          <p class="instruction" id="instruction">開啟體感，搖一搖手機</p>
        </div>
        <span class="sensor-pill" id="sensorStatus"><span class="sensor-dot" aria-hidden="true"></span>體感待開啟</span>
      </div>

      <div class="energy-track" id="energy" role="progressbar" aria-label="搖骰能量" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="energy-fill" id="energyFill"></div>
      </div>

      <div class="controls">
        <button class="button button-primary" id="startBtn" type="button">
          <span class="button-icon motion-icon" aria-hidden="true"><i></i><i></i></span>
          <span>開啟體感</span>
        </button>
        <button class="button button-secondary" id="shakeBtn" type="button" aria-label="按住模擬搖骰">
          <span class="button-icon shake-icon" aria-hidden="true">✳</span>
          <span>按住模擬搖骰</span>
        </button>
        <button class="button button-reveal" id="revealBtn" type="button" disabled>
          <span>放平／揭盅</span><span class="reveal-arrow" aria-hidden="true">↗</span>
        </button>
      </div>

      <button class="next-button" id="nextBtn" type="button" hidden>輪到下一人 <span aria-hidden="true">→</span></button>
      <section class="result-card" id="result" aria-live="polite" hidden></section>
      <p class="announcement" id="announcement" aria-live="polite" hidden></p>
      <div class="voice-row">
        <button class="voice-button" id="voiceBtn" type="button">試聽廣東話報點</button>
        <span id="voiceStatus" class="voice-status">正在檢查廣東話語音…</span>
      </div>
    </section>

    <footer class="game-footer">
      <p class="rule-note"><span class="rule-mark" aria-hidden="true">◇</span>三骰總點數較大者勝 · 同分平局 · 兩人輪流</p>
      <div class="footer-bottom">
        <span class="device-note">手機支援體感，請在 Chrome 打開</span>
        <button class="reset-button" id="resetBtn" type="button"><span aria-hidden="true">↺</span> 重新開始</button>
      </div>
      <p class="fair-play">輕鬆桌遊，不涉及賭博或金錢</p>
      <p class="audio-credit">骰盅實錄：<a href="https://pixabay.com/sound-effects/dice-cup-60668/" target="_blank" rel="noopener">Breviceps / Pixabay</a> · <a href="https://pixabay.com/service/license-summary/" target="_blank" rel="noopener">Content License</a></p>
    </footer>
  </main>
</body>
</html>
